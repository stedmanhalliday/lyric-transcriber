<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lyric Transcriber</title>
<style>
  body { font: 16px/1.5 -apple-system, system-ui, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 16px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 8px; font: inherit; }
  button { padding: 8px 14px; font: inherit; cursor: pointer; }
  #status { margin: 16px 0; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #ccc; border-top-color: #333;
             border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { color: #b00020; }
  pre { white-space: pre-wrap; background: #f5f5f5; padding: 16px; border-radius: 6px; }
  [hidden] { display: none; }
</style>
</head>
<body>
<h1>Lyric Transcriber</h1>
<form id="form">
  <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..." required>
  <button id="go" type="submit">Transcribe</button>
</form>
<div id="status"></div>
<div id="result" hidden>
  <button id="copy" type="button">Copy</button>
  <pre id="lyrics"></pre>
</div>
<script>
  const $ = (id) => document.getElementById(id);

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("go").disabled = true;
    $("result").hidden = true;
    $("status").className = "";
    $("status").innerHTML = '<span class="spinner"></span>Working, this takes 1–3 min';
    try {
      const res = await fetch("/transcribe", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: $("url").value }),
        signal: AbortSignal.timeout(15 * 60 * 1000),
      });
      const data = await res.json().catch(() => ({ error: `Server returned ${res.status}` }));
      if (!res.ok) throw new Error(data.error || `Server returned ${res.status}`);
      $("status").textContent = "";
      $("lyrics").textContent = data.lyrics || "(no lyrics detected)";
      $("result").hidden = false;
    } catch (err) {
      $("status").className = "error";
      $("status").textContent = err.message;
    } finally {
      $("go").disabled = false;
    }
  });

  $("copy").addEventListener("click", async () => {
    await navigator.clipboard.writeText($("lyrics").textContent);
    $("copy").textContent = "Copied";
    setTimeout(() => ($("copy").textContent = "Copy"), 1500);
  });
</script>
</body>
</html>
